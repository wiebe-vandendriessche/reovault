# Two equally supported ways to reach the dashboard; pick one. Either way,
# leave REOVAULT_WEB__HOST at the image's 0.0.0.0: inside a container,
# 127.0.0.1 is unreachable from a published port and from a reverse proxy.
#
# Mode A: publish the port directly (LAN/VPN). Uncomment `ports:` and the two
#   REOVAULT_WEB__* lines under it. Plain HTTP has no certificate, so the
#   session cookie must not require TLS (cookie_secure=false), or login
#   silently bounces back to /login.
#
# Mode B (active default): behind a reverse proxy (Traefik, Nginx Proxy
#   Manager, Caddy, ...) on a shared Docker network; the proxy handles TLS.
#   Uncomment `networks:` below, and set REOVAULT_WEB__FORWARDED_ALLOW_IPS to
#   the proxy's container IP/subnet (never "*": any client could then spoof
#   its address).

services:
  reovault:
    # Signed release image (see docs/installation.md to verify it). Pin a tag
    # like `:2.0.0` to upgrade on your own schedule.
    image: ghcr.io/wiebe-vandendriessche/reovault:latest
    # To build from a source checkout instead:
    # build: .
    restart: unless-stopped
    # restic groups retention by host name, and Docker gives every recreated
    # container a new one: keep it fixed.
    hostname: reovault
    # Mode A: direct port publish:
    # ports:
    #   - "8080:8080"
    environment:
      # Mode B (active default): the reverse proxy's own container IP/subnet:
      REOVAULT_WEB__FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      # Mode A: uncomment these two instead, comment out the line above:
      # REOVAULT_WEB__FORWARDED_ALLOW_IPS: "127.0.0.1"
      # REOVAULT_WEB__COOKIE_SECURE: "false"
    secrets:
      - restic_password
      # Alert channel secrets (see docs/installation.md#alerts), e.g.:
      # - ntfy_token
    volumes:
      # reovault.toml and rclone/rclone.conf. Read-write folders, not single
      # files: the dashboard writes settings back atomically, and rclone
      # rewrites the config whenever it refreshes an OAuth token.
      - ./config:/config
      # Database, restic cache, and the one batch of clips waiting for upload.
      - ./data:/data
      # reolink-cli's own encrypted camera registry (passwords live here, not
      # in ReoVault).
      - ./reolink-cli:/home/reovault/.config/reolink-cli
      # Only when the backup destination is a local path, e.g.
      # repository = "/backups" in reovault.toml:
      # - /mnt/backup-disk/reovault:/backups
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Mode B: join the reverse proxy's network:
    # networks:
    #   - proxy_network

secrets:
  # The restic repository password. Losing it makes every backup
  # unreadable: keep a copy in your password manager.
  restic_password:
    file: ./secrets/restic_password.txt
  # ntfy_token:
  #   file: ./secrets/ntfy_token.txt

# networks:
#   proxy_network:
#     external: true
