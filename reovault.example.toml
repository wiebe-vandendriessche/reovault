# Copy to reovault.toml next to compose.yaml and adjust. This file is the source of truth:
# the dashboard's Settings and Cameras pages write their changes back into it
# (comments kept), and edits made here are picked up live.
#
# It holds the camera passwords: keep it private (chmod 600). The restic
# password is its own file, restic-password (one for all destinations); alert
# tokens are file paths.

# The cameras to back up. `id` names the camera's restic repository, so it
# never changes. The dashboard's Cameras page adds entries here for you.
[[cameras]]
id = "front-door"
name = "Front door"
timezone = "Europe/Brussels"  # the camera's own clock
host = "192.168.1.40"         # give the camera a DHCP reservation
# user = "admin"
password = "the camera's password"
# enabled = false             # stop backing it up; its backups stay

# A pretend camera with a sliding week of tiny clips, to try ReoVault
# without hardware:
# [[cameras]]
# id = "demo"
# timezone = "Europe/Brussels"
# demo = true

[backup]
interval_minutes = 60

# Where backups go. Each camera gets its own restic repository inside each
# destination. The primary is backed up to first (ideally a local disk); every
# other destination receives copies (3-2-1). The dashboard's Settings,
# Destinations tab edits these for you, and can connect Nextcloud, OneDrive,
# Google Drive, SFTP, S3 and B2 without touching rclone.conf.
[[destinations]]
name = "local"
repository = "/backups"       # a path mounted into the container
primary = true                # with more than one destination, exactly one
keep_days = 30                # 0 keeps everything; counted from the newest backup
# max_gb = 500                # size limit, the oldest backups go first; 0 = none

# [[destinations]]
# name = "cloud"
# repository = "rclone:nextcloud:reovault"   # an rclone remote from rclone.conf
# keep_days = 14
# max_gb = 200

# Where alerts go (see docs/configuration.md#alerts). Secrets live in files
# next to this one (the folder is /config in the container).
[alerts]
# ntfy_url = "https://ntfy.sh/an-unguessable-topic"
# ntfy_token_file = "/config/ntfy-token"
# webhook_url_file = "/config/alert-webhook"
# smtp_host = "smtp.example.com"
# smtp_user = "reovault@example.com"
# smtp_password_file = "/config/smtp-password"
# smtp_to = ["you@example.com"]

[alerts.rules]
# renotify_hours = 24

[web]
# email = "you@example.com"  # set by the first-run screen
# update_check = false        # stop the daily check for a new release
cookie_secure = true          # false for a plain-http direct port (compose Mode A)
session_max_age_days = 30
