# Copy to config/reovault.toml and adjust. This file is the source of truth:
# the dashboard's Settings and Cameras pages write their changes back into it
# (comments kept), and edits made here are picked up live.
#
# No secrets in this file. Camera passwords live in reolink-cli's own
# encrypted registry; the restic password is a Docker secret; alert tokens are
# file paths.

# The cameras to back up. `alias` is the `reolink-cli device add <alias>` name
# and also names the camera's restic repository, so it never changes. The
# dashboard's Cameras page adds entries here for you.
[[cameras]]
alias = "front-door"
name = "Front door"
timezone = "Europe/Brussels"  # the camera's own clock
# enabled = false             # stop backing it up; its backups stay

# A pretend camera with a sliding week of tiny clips, to try ReoVault
# without hardware:
# [[cameras]]
# alias = "demo"
# timezone = "Europe/Brussels"
# demo = true

[backup]
# Where backups go. Each camera gets its own restic repository inside it:
#   a local path, mounted into the container:  "/backups"
#   an rclone remote from config/rclone/rclone.conf:  "rclone:nextcloud:reovault"
#   any other restic backend:  "sftp:user@host:/reovault", "s3:...", "rest:..."
repository = "rclone:nextcloud:reovault"
interval_minutes = 60
# Delete backups older than this many days, counted from the newest backup
# (so an outage never deletes history). 0 keeps everything.
keep_days = 0

# Where alerts go (see docs/configuration.md#alerts). Secrets live in files,
# mounted as Docker secrets.
[alerts]
# ntfy_url = "https://ntfy.sh/an-unguessable-topic"
# ntfy_token_file = "/run/secrets/ntfy_token"
# webhook_url_file = "/run/secrets/alert_webhook"
# smtp_host = "smtp.example.com"
# smtp_user = "reovault@example.com"
# smtp_password_file = "/run/secrets/smtp_password"
# smtp_to = ["you@example.com"]

[alerts.rules]
# renotify_hours = 24

[web]
# email = "you@example.com"  # required before `reovault web set-password`
cookie_secure = true          # false for a plain-http direct port (compose Mode A)
session_max_age_days = 30
