[project]
name = "reovault"
version = "0.1.0"
description = "Local-first, self-hosted archiving of Reolink camera recordings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Wiebe Vandendriessche" }]
maintainers = [{ name = "Wiebe Vandendriessche" }]
urls = { Homepage = "https://github.com/wiebe-vandendriessche/reovault", Documentation = "https://wiebe-vandendriessche.github.io/reovault/", Issues = "https://github.com/wiebe-vandendriessche/reovault/issues" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43.0",
    "typer>=0.12",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "structlog>=24.4",
]

[project.scripts]
reovault = "reovault.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=0.28",  # required by starlette.testclient (FastAPI's TestClient)
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reovault"]
artifacts = ["reovault/db/migrations/*.sql", "reovault/web/templates/**", "reovault/web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: opt-in tests that hit a real doorbell; excluded from CI",
    "slow: opt-in tests that seed ~300k rows to measure query performance at scale",
]
addopts = "-m 'not contract and not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented CLI-argument pattern is `param: T = typer.Option(...)`.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["reovault.crypto.*", "reovault.providers.*"]
strict = true

[[tool.mypy.overrides]]
# No type stubs / py.typed marker shipped.
module = ["apscheduler.*"]
ignore_missing_imports = true
