<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000814" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="preload" href="%sveltekit.assets%/fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin />
		<title>ReoVault</title>
		<!-- Theme before first paint: the stored choice, else the OS preference.
		     Inline on purpose; the server hashes it into the CSP at startup. -->
		<script>
			try {
				var t = localStorage.getItem('rv-theme');
				if (t !== 'light' && t !== 'dark')
					t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
