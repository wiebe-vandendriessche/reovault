version: 2

# One pull request per week for every version update in every ecosystem,
# majors included. Security updates still arrive on their own, as soon as an
# advisory is published.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    ignore:
      # svelte-check, SvelteKit 3 and openapi-typescript don't support
      # TypeScript 7 yet. Drop this once they do.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
