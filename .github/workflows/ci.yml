name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy reovault

      - name: Install pinned restic and rclone
        # The engine tests run the real binaries, never a fake; same fetcher
        # and checksums as the Dockerfile.
        run: |
          python3 scripts/fetch_tools.py --only restic,rclone "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: pytest (unit + integration, contract excluded)
        run: uv run pytest -q --cov=reovault --cov-report=term-missing

      - name: OpenAPI schema is up to date
        # The dashboard's types are generated from this file; a stale copy
        # means the frontend compiles against an API that no longer exists.
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u dashboard/openapi.json /tmp/openapi.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    # Every page in a real browser against a demo instance: catches CSP
    # violations and console errors svelte-check can't see.
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - name: Install pinned restic and rclone
        run: |
          python3 scripts/fetch_tools.py --only restic,rclone "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts
          npm run build
          cp -r build ../reovault/web/dist
      - name: Start the browser
        # The image tag must equal the playwright pin in pyproject.toml.
        run: |
          docker run -d --rm --name pw --network host --init \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            npx -y playwright@1.64.1 run-server --port 3123 --host 127.0.0.1
          for i in $(seq 1 60); do nc -z 127.0.0.1 3123 && break; sleep 1; done
      - name: Browser tests
        run: uv run pytest -m e2e -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push, both release platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
