name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy reovault

      - name: Install pinned restic and rclone
        # The engine tests run the real binaries, never a fake. Same
        # versions and checksum checks as the Dockerfile.
        env:
          RESTIC_RELEASE: "0.19.1"
          RCLONE_RELEASE: "1.75.2"
        run: |
          set -eu
          mkdir -p "$HOME/bin" /tmp/tools && cd /tmp/tools
          curl -fsSLO "https://github.com/restic/restic/releases/download/v${RESTIC_RELEASE}/restic_${RESTIC_RELEASE}_linux_amd64.bz2"
          curl -fsSL "https://github.com/restic/restic/releases/download/v${RESTIC_RELEASE}/SHA256SUMS" -o restic.sums
          grep " restic_${RESTIC_RELEASE}_linux_amd64.bz2$" restic.sums | sha256sum -c -
          bunzip2 -c "restic_${RESTIC_RELEASE}_linux_amd64.bz2" > "$HOME/bin/restic"
          curl -fsSLO "https://github.com/rclone/rclone/releases/download/v${RCLONE_RELEASE}/rclone-v${RCLONE_RELEASE}-linux-amd64.zip"
          curl -fsSL "https://github.com/rclone/rclone/releases/download/v${RCLONE_RELEASE}/SHA256SUMS" -o rclone.sums
          grep -a " rclone-v${RCLONE_RELEASE}-linux-amd64.zip$" rclone.sums | sha256sum -c -
          unzip -p "rclone-v${RCLONE_RELEASE}-linux-amd64.zip" "rclone-v${RCLONE_RELEASE}-linux-amd64/rclone" > "$HOME/bin/rclone"
          chmod +x "$HOME/bin/restic" "$HOME/bin/rclone"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: pytest (unit + integration, contract excluded)
        run: uv run pytest -q --cov=reovault --cov-report=term-missing

      - name: OpenAPI schema is up to date
        # The dashboard's types are generated from this file; a stale copy
        # means the frontend compiles against an API that no longer exists.
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u dashboard/openapi.json /tmp/openapi.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push, both release platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
