name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy reovault

      - name: pytest (unit + integration, contract excluded)
        run: uv run pytest -q --cov=reovault --cov-report=term-missing

      - name: OpenAPI schema is up to date
        # The dashboard's types are generated from this file; a stale copy
        # means the frontend compiles against an API that no longer exists.
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u dashboard/openapi.json /tmp/openapi.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push, both release platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
